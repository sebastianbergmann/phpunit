# https://github.com/marketplace/actions/api-surface-check-for-php

on:
  pull_request:
    paths-ignore:
      - ".editorconfig"
      - "LICENSE"
      - "**.md"
      - "**.png"
      - "**.svg"
      - "tests/**"

name: "API Surface Check"

permissions:
  contents: read

concurrency:
  group: api-surface-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze API Surface
    runs-on: ubuntu-latest
    steps:
      - uses: composer/api-surface-check@09e3754365a4626daac35eef61d474a389961084 # 2.0.0
